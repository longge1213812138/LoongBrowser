<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 方案 E：L 字母标 · 硬朗几何，龙 = Long 双关；底色取自 Vista 冷蓝点缀 -->
  <rect width="512" height="512" rx="112" fill="#1E63A8"/>
  <!-- L 竖 -->
  <rect x="170" y="118" width="60" height="256" rx="30" fill="#FFFFFF"/>
  <!-- L 横 -->
  <rect x="170" y="314" width="188" height="60" rx="30" fill="#FFFFFF"/>
  <!-- 右上角一点，暗示"页面/窗口" -->
  <rect x="300" y="118" width="60" height="140" rx="30" fill="#7AA8D8"/>
</svg>
